    <style>
        /* --- 基础和背景设置 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #05070f;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 18% 20%, rgba(74, 144, 226, 0.18), transparent 42%),
                radial-gradient(circle at 82% 8%, rgba(120, 90, 200, 0.14), transparent 45%),
                radial-gradient(circle at 50% 110%, rgba(0, 170, 210, 0.10), transparent 55%),
                linear-gradient(180deg, #05070f 0%, #0b1020 45%, #04060c 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* --- 文字选中颜色 --- */
        ::selection {
            background: rgba(74, 144, 226, 0.42);
            color: #ffffff;
        }
        ::-moz-selection {
            background: rgba(74, 144, 226, 0.42);
            color: #ffffff;
        }

        /* --- 星空画布：固定在底层，不挡交互 --- */
        #starfield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        /* 全局文字描边阴影，保证可读性 */
        .name, .motto, .identity {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 2px rgba(0, 0, 0, 0.4);
        }

        /* --- 主卡片 --- */
        main.container {
            position: relative;
            z-index: 1;
            padding: 2rem;
            background-color: rgba(10, 14, 26, 0.48);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* --- 头像翻转效果 --- */
        .avatar-container {
            width: 150px;
            height: 150px;
            perspective: 1000px;
            margin: 0 auto;
        }

        .flipper {
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
        }

        .avatar-container:hover .flipper {
            transform: rotateY(180deg);
        }

        .front, .back {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .front {
            background-color: #555;
            z-index: 2;
            padding: 0;
        }

        .front img, .front picture {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .back {
            background-color: #4A90E2;
            transform: rotateY(180deg);
            padding: 0;
        }

        .back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- 触屏设备：自动缓慢翻转 --- */
        @media (hover: none) {
            .avatar-container:hover .flipper {
                transform: none;
            }
            .avatar-container .flipper {
                animation: avatarFlip 12s ease-in-out infinite;
            }
            @keyframes avatarFlip {
                0%,   42% { transform: rotateY(0deg); }
                50%,  92% { transform: rotateY(180deg); }
                100%      { transform: rotateY(360deg); }
            }
        }

        /* --- 其他元素样式 --- */
        .name {
            font-size: 2.5rem;
            margin: 1rem 0 0.5rem 0;
        }

        .motto {
            font-size: 1.2rem;

        }

        .identity {
            font-size: 0.9rem;

            letter-spacing: 0.5px;
        }

        .identity .sep {
            color: #4A90E2;
            margin: 0 0.5rem;

        /* --- 渐变分隔线 --- */
        .divider {
            width: 80px;
            height: 1px;
            border: none;
            margin: 1.5rem auto;
            background: linear-gradient(
                to right,

        .answer-box {

        #answer-text {

        /* --- 导航栏样式 --- */
        .navigation {
            margin: 1.5rem 0;
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;

        .navigation a {

        .navigation::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .navigation::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.4); border-radius: 10px; }

        .social-links a {
            color: #ccc;

        .social-links a:hover { color: #fff; }

        .svg-icon {
            width: 1.5rem;

        }

        /* --- [自适应优化] --- */
        main.container {
            max-width: 500px;
            width: 90%;
            box-sizing: border-box;
        }

        @media (max-width: 480px) {
            main.container {

        }

        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            main.container { animation: none; }
        }

    <script>
        (function () {
            /* ============ 心灵毒鸡汤（极数本源 ApiZero） ============ */
            async function fetchSoulSoup() {
                const answerElement = document.getElementById('answer-text');
                try {
                    const response = await fetch('https://v1.apizero.cn/api/soul-soup', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({})
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    const data = await response.json();

                    // 极数本源约定：成功看 code === 0
                    if (data.code !== 0 && data.code !== 200) {
                        throw new Error(data.msg || '接口返回异常');
                    }

                    // 文档中 data.content 为毒鸡汤正文
                    const content = data.data && data.data.content;
                    if (!content) {
                        throw new Error('返回内容为空');
                    }

                    answerElement.textContent = '「 ' + content + ' 」';
                } catch (error) {
                    console.error('获取毒鸡汤失败:', error);
                    answerElement.textContent = '今天的鸡汤喝完了';
                }
            }

            fetchSoulSoup();

            /* ============ 动态星空 ============ */
            const canvas = document.getElementById('starfield');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const mobile = window.innerWidth < 768;
            const cores = navigator.hardwareConcurrency || 4;
            const memory = navigator.deviceMemory || 4;
            const isLowEnd = (cores <= 4) || (memory <= 2);

            let starDivisor, starCap, enableGlow, enableMeteor, targetFPS;

            if (isLowEnd && mobile) {
                starDivisor = 5000;
                starCap = 320;
                enableGlow = false;
                enableMeteor = false;
                targetFPS = 24;
            } else if (isLowEnd) {
                starDivisor = 2600;
                starCap = 900;
                enableGlow = false;
                enableMeteor = true;
                targetFPS = 30;
            } else if (mobile) {
                starDivisor = 2600;
                starCap = 800;
                enableGlow = true;
                enableMeteor = true;
                targetFPS = 30;
            } else {
                starDivisor = 1500;
                starCap = 2000;
                enableGlow = true;
                enableMeteor = true;
                targetFPS = 30;
            }

            const FRAME_INTERVAL = 1000 / targetFPS;

            let w = 0, h = 0, dpr = 1;
            let stars = [];
            let meteors = [];
            let lastTime = 0;
            let prevFrameT = 0;
            let lastRenderTime = 0;
            let meteorTimer = 0;
            let nextMeteorAt = 2500 + Math.random() * 4000;
            let running = !document.hidden;

            const GLOW_SIZE = 64;
            const glowCanvas = document.createElement('canvas');
            glowCanvas.width = glowCanvas.height = GLOW_SIZE;
            (function () {
                const g = glowCanvas.getContext('2d');
                const grd = g.createRadialGradient(
                    GLOW_SIZE / 2, GLOW_SIZE / 2, 0,
                    GLOW_SIZE / 2, GLOW_SIZE / 2, GLOW_SIZE / 2
                );
                grd.addColorStop(0,    'rgba(255,255,255,1)');
                grd.addColorStop(0.18, 'rgba(255,255,255,0.45)');
                grd.addColorStop(0.45, 'rgba(255,255,255,0.10)');
                grd.addColorStop(1,    'rgba(255,255,255,0)');
                g.fillStyle = grd;
                g.fillRect(0, 0, GLOW_SIZE, GLOW_SIZE);
            })();

            const STAR_COLORS = [
                'rgba(175, 200, 255, ',
                'rgba(215, 228, 255, ',
                'rgba(245, 248, 255, ',
                'rgba(255, 250, 235, ',
                'rgba(255, 232, 200, '
            ];

            function pickColor() {
                const r = Math.random();
                if (r < 0.06) return STAR_COLORS[0];
                if (r < 0.30) return STAR_COLORS[1];
                if (r < 0.70) return STAR_COLORS[2];
                if (r < 0.91) return STAR_COLORS[3];
                return STAR_COLORS[4];
            }

            function makeStar(inGalaxy, cx, cy, ux, uy, spread) {
                let x, y;
                if (inGalaxy) {
                    const diag = Math.sqrt(w * w + h * h) * 1.2;
                    const along = (Math.random() - 0.5) * diag;
                    const off = (Math.random() + Math.random() + Math.random() - 1.5) * spread;
                    x = cx + ux * along - uy * off;
                    y = cy + uy * along + ux * off;
                } else {
                    x = Math.random() * w;
                    y = Math.random() * h;
                }

                const roll = Math.random();
                let tier, alpha, radius;

                if (roll < 0.70) {
                    tier = 0;
                    alpha = 0.05 + Math.random() * 0.20;
                    radius = 0.25 + Math.random() * 0.40;
                } else if (roll < 0.92) {
                    tier = 1;
                    alpha = 0.28 + Math.random() * 0.32;
                    radius = 0.60 + Math.random() * 0.50;
                } else if (roll < 0.985) {
                    tier = 2;
                    alpha = 0.65 + Math.random() * 0.30;
                    radius = 1.00 + Math.random() * 0.60;
                } else {
                    tier = 3;
                    alpha = 0.88 + Math.random() * 0.12;
                    radius = 1.50 + Math.random() * 0.90;
                }

                if (inGalaxy) {
                    alpha *= 0.60;
                    radius *= 0.78;
                }

                return {
                    x: x,
                    y: y,
                    r: radius,
                    a: alpha,
                    tier: tier,
                    color: pickColor(),
                    sp1: 0.0004 + Math.random() * 0.0011,
                    sp2: 0.0017 + Math.random() * 0.0026,
                    ph1: Math.random() * Math.PI * 2,
                    ph2: Math.random() * Math.PI * 2,
                    twk: tier === 3 ? 0.55 : tier === 2 ? 0.42 : tier === 1 ? 0.26 : 0.14,
                    drift: 0.004 + Math.random() * 0.014
                };
            }

            function buildStars() {
                const area = w * h;
                const baseCount = Math.min(starCap, Math.round(area / starDivisor));

                const galAngle = -Math.PI / 6.5;
                const ux = Math.cos(galAngle);
                const uy = Math.sin(galAngle);
                const gcx = w * 0.5;
                const gcy = h * 0.5;
                const gSpread = Math.min(w, h) * 0.20;

                stars = [];
                for (let i = 0; i < baseCount; i++) {
                    stars.push(makeStar(false));
                }
                const galaxyCount = Math.round(baseCount * 0.60);
                for (let i = 0; i < galaxyCount; i++) {
                    stars.push(makeStar(true, gcx, gcy, ux, uy, gSpread));
                }
            }

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = window.innerWidth;
                h = window.innerHeight;

                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                buildStars();
                render(0, 1);
            }

            function spawnMeteor() {
                const angle = Math.PI / 4 + (Math.random() - 0.5) * 0.4;
                meteors.push({
                    x: Math.random() * w * 0.8 + w * 0.1,
                    y: Math.random() * h * 0.4,
                    len: 90 + Math.random() * 130,
                    speed: 5 + Math.random() * 6,
                    angle: angle,
                    life: 1
                });
            }

            function render(t, dt) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.clearRect(0, 0, w, h);

                ctx.globalCompositeOperation = 'lighter';

                if (enableGlow) {
                    for (let i = 0; i < stars.length; i++) {
                        const s = stars[i];
                        if (s.tier < 2) continue;

                        let alpha = s.a;
                        if (!reduceMotion) {
                            const tw = Math.sin(t * s.sp1 + s.ph1) * 0.5
                                     + Math.sin(t * s.sp2 + s.ph2) * 0.5;
                            alpha = s.a * (1 - s.twk * (0.5 + 0.5 * tw));
                        }

                        const gsize = s.r * (s.tier === 3 ? 14 : 9);
                        ctx.globalAlpha = Math.max(0, Math.min(1, alpha * 0.55));
                        ctx.drawImage(
                            glowCanvas,
                            s.x - gsize / 2, s.y - gsize / 2,
                            gsize, gsize
                        );
                    }
                }

                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];

                    let alpha = s.a;
                    if (!reduceMotion && s.tier > 0) {
                        const tw = Math.sin(t * s.sp1 + s.ph1) * 0.5
                                 + Math.sin(t * s.sp2 + s.ph2) * 0.5;
                        alpha = s.a * (1 - s.twk * (0.5 + 0.5 * tw));
                    }
                    alpha = Math.max(0, Math.min(1, alpha));
                    if (alpha < 0.02) continue;

                    ctx.globalAlpha = 1;
                    ctx.fillStyle = s.color + alpha.toFixed(3) + ')';

                    if (s.r < 0.55) {
                        const sz = s.r * 2;
                        ctx.fillRect(s.x - s.r, s.y - s.r, sz, sz);
                    } else {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    if (s.tier === 3 && enableGlow) {
                        const len = s.r * 6.5;
                        ctx.globalAlpha = 1;
                        ctx.strokeStyle = s.color + (alpha * 0.28).toFixed(3) + ')';
                        ctx.lineWidth = 0.7;
                        ctx.beginPath();
                        ctx.moveTo(s.x - len, s.y);
                        ctx.lineTo(s.x + len, s.y);
                        ctx.moveTo(s.x, s.y - len);
                        ctx.lineTo(s.x, s.y + len);
                        ctx.stroke();
                    }

                    if (!reduceMotion) {
                        s.y -= s.drift * dt;
                        if (s.y < -3) {
                            s.y = h + 3;
                            s.x = Math.random() * w;
                        }
                    }
                }

                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';

                if (enableMeteor) {
                    for (let i = meteors.length - 1; i >= 0; i--) {
                        const m = meteors[i];
                        m.x += Math.cos(m.angle) * m.speed * dt;
                        m.y += Math.sin(m.angle) * m.speed * dt;
                        m.life -= 0.011 * dt;

                        if (m.life <= 0 || m.x > w + 300 || m.y > h + 300) {
                            meteors.splice(i, 1);
                            continue;
                        }

                        const tailX = m.x - Math.cos(m.angle) * m.len;
                        const tailY = m.y - Math.sin(m.angle) * m.len;
                        const lf = Math.max(m.life, 0);

                        const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
                        grad.addColorStop(0,    'rgba(255,255,255,' + lf.toFixed(3) + ')');
                        grad.addColorStop(0.35, 'rgba(200,220,255,' + (lf * 0.5).toFixed(3) + ')');
                        grad.addColorStop(1,    'rgba(255,255,255,0)');

                        ctx.beginPath();
                        ctx.moveTo(m.x, m.y);
                        ctx.lineTo(tailX, tailY);
                        ctx.strokeStyle = grad;
                        ctx.lineWidth = 1.8;
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,' + lf.toFixed(3) + ')';
                        ctx.fill();
                    }
                }
            }

            function loop(t) {
                if (!running) return;

                if (!lastTime) {
                    lastTime = t;
                    prevFrameT = t;
                    lastRenderTime = t;
                }

                const dt = Math.min((t - lastTime) / 16.667, 3);
                const rawDt = t - prevFrameT;
                lastTime = t;
                prevFrameT = t;

                if (t - lastRenderTime < FRAME_INTERVAL) {
                    requestAnimationFrame(loop);
                    return;
                }
                lastRenderTime = t;

                if (!reduceMotion && enableMeteor) {
                    meteorTimer += rawDt;
                    if (meteorTimer >= nextMeteorAt) {
                        spawnMeteor();
                        meteorTimer = 0;
                        nextMeteorAt = 3500 + Math.random() * 6500;
                    }
                }

                render(t, dt);
                requestAnimationFrame(loop);
            }

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    running = false;
                } else {
                    if (!running) {
                        running = true;
                        lastTime = 0;
                        prevFrameT = 0;
                        lastRenderTime = 0;
                        if (!reduceMotion) requestAnimationFrame(loop);
                    }
                }
            });

            resize();

            if (reduceMotion) {
                render(0, 1);
            } else if (running) {
                requestAnimationFrame(loop);
            }

            let resizeTimer = null;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(resize, 150);
            });
        })();
    </script>
</body>
