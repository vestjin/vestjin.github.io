<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>片单 · Watch List</title>
<!-- 标签页图标：内嵌 SVG，绿叶胶片 -->
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="%23eef7f0"/%3E%3Cpath d="M32 10c-12 4-20 12-20 24 0 10 8 18 18 18h4c10 0 18-8 18-18 0-12-8-20-20-24z" fill="%233a9d5d"/%3E%3Cpath d="M32 52V22M32 34l-8-8M32 40l10-10" stroke="%23ffffff" stroke-width="3" stroke-linecap="round" fill="none"/%3E%3C/svg%3E'>
<style>
  :root {
    --bg: #f2f9f4;          /* 淡草青底 */
    --card: #ffffff;
    --text: #1f3d2b;        /* 深松绿墨 */
    --text-3: #8aa895;
    --accent: #2e9e5b;      /* 主绿：草木绿 */
    --accent-soft: #d5efdd;
    --border: #d6e8dc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7;
    padding: 0 clamp(16px, 4vw, 32px) 80px; max-width: 720px; margin: 0 auto;
  }
  header { padding: clamp(40px, 8vw, 64px) 0 clamp(16px, 3vw, 24px); }
  h1 {
    font-size: clamp(22px, 4.5vw, 28px); font-weight: 700;
    font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
  }
  h1::before { content: "— "; color: var(--accent); }
  h1::after { content: " —"; color: var(--accent); }
  header p { margin-top: 6px; color: var(--text-3); font-size: 14px; }

  /* ===== 吸顶分类栏 ===== */
  .cats {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 10px 0; margin: 0 calc(-1 * clamp(16px, 4vw, 32px));
    padding-left: clamp(16px, 4vw, 32px); padding-right: clamp(16px, 4vw, 32px);
    background: var(--bg);
    box-shadow: 0 6px 12px -8px rgba(46, 158, 91, 0.25);
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat-btn {
    font: inherit; font-size: 13.5px; padding: 5px 16px;
    border-radius: 99px; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: all .15s;
  }
  .cat-btn .count { font-size: 12px; opacity: .6; margin-left: 3px; }
  .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cat-btn.active {
    background: var(--accent); border-color: var(--accent);
    color: #fff;
  }
  .cat-btn.active .count { opacity: .8; }

  /* ===== 分类区块 =====
     content-visibility：屏幕外的分类跳过渲染，内容多时滚动性能大幅提升 */
  .cat {
    margin-top: clamp(24px, 4vw, 36px);
    content-visibility: auto;
    contain-intrinsic-size: auto 400px;
  }
  .cat.hidden { display: none; }
  .cat-title {
    display: flex; align-items: baseline; gap: 10px;
    font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
    font-size: 18px; font-weight: 700;
    border-bottom: 2px solid var(--accent-soft); padding-bottom: 8px; margin-bottom: 10px;
  }
  .cat-title .num {
    font-size: 12px; color: var(--accent); font-weight: 600;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .cat-title::before {
    content: ""; width: 4px; height: 16px; border-radius: 2px;
    background: var(--accent); align-self: center;
  }

  /* ===== 条目卡片：入场动画（初始透明下移，进视口后浮现） ===== */
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; margin: 6px 0;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .4s ease, transform .4s ease,
                border-color .15s, box-shadow .15s;
  }
  .item.visible { opacity: 1; transform: none; }
  .item:hover {
    transform: translateX(3px);
    border-color: var(--accent);
    box-shadow: 0 2px 10px rgba(46, 158, 91, 0.12);
  }
  .item.visible:hover { transform: translateX(3px); }
  .item::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); opacity: .5; flex-shrink: 0;
  }

  /* ===== 回到顶部 ===== */
  #toTop {
    position: fixed; right: clamp(16px, 4vw, 40px); bottom: 32px;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card); color: var(--accent);
    font-size: 18px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(46, 158, 91, 0.18);
    opacity: 0; pointer-events: none; transform: translateY(10px);
    transition: all .25s; z-index: 20;
  }
  #toTop.show { opacity: 1; pointer-events: auto; transform: none; }
  #toTop:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .loading { text-align: center; color: var(--text-3); padding: 60px 0; }

  /* ===== 尊重系统"减少动态"设置 ===== */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .item { opacity: 1; transform: none; transition: border-color .15s; }
    .item:hover { transform: none; }
    #toTop { transition: opacity .25s; }
  }
</style>
</head>
<body>
<header>
  <h1>片单</h1>
  <p>共 <span id="total">0</span> 部 · 不定期更新</p>
</header>

<!-- 吸顶分类栏：数据加载后自动生成 -->
<nav class="cats" id="cats" style="display:none;"></nav>

<div id="content"><p class="loading">正在加载 …</p></div>

<button id="toTop" title="回到顶部" aria-label="回到顶部">↑</button>

<script>
fetch('media.md')
  .then(r => { if (!r.ok) throw 0; return r.text(); })
  .then(text => {
    /* ================= 解析 ================= */
    const cats = [];   // [{ name, items: [名字, ...] }]
    for (const line of text.split('\n')) {
      const t = line.trim();
      if (!t) continue;
      if (t.startsWith('#')) {
        cats.push({ name: t.replace(/^#+\s*/, ''), items: [] });
        continue;
      }
      cats[cats.length - 1].items.push(t);
    }

    const valid = cats.filter(c => c.items.length);
    let total = 0, html = '';
    for (const cat of valid) {
      total += cat.items.length;
      html += `<section class="cat" data-cat="${cat.name}"><h2 class="cat-title">${cat.name}<span class="num">${cat.items.length} 部</span></h2>`;
      for (const name of cat.items) {
        html += `<div class="item">${name}</div>`;
      }
      html += `</section>`;
    }
    document.getElementById('total').textContent = total;
    document.getElementById('content').innerHTML = html;

    /* ================= 吸顶分类栏 ================= */
    const catsNav = document.getElementById('cats');
    catsNav.innerHTML =
      `<button class="cat-btn active" data-cat="">全部<span class="count">${total}</span></button>` +
      valid.map(c =>
        `<button class="cat-btn" data-cat="${c.name}">${c.name}<span class="count">${c.items.length}</span></button>`
      ).join('');
    catsNav.style.display = 'flex';

    // 筛选状态：'' = 显示全部（此时 scrollspy 接管高亮）
    let filterMode = '';

    catsNav.addEventListener('click', e => {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;
      const picked = btn.dataset.cat;
      const isSame = btn.classList.contains('active') && picked !== '';

      document.querySelectorAll('.cat').forEach(sec => {
        sec.classList.toggle('hidden', picked !== '' && sec.dataset.cat !== picked);
      });

      if (picked === '' || isSame) {
        filterMode = '';
        catsNav.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        catsNav.querySelector('[data-cat=""]').classList.add('active');
      } else {
        filterMode = picked;
        catsNav.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    /* ================= 入场动画：进视口才显示 ================= */
    const io = new IntersectionObserver(entries => {
      for (const en of entries) {
        if (en.isIntersecting) {
          en.target.classList.add('visible');
          io.unobserve(en.target);
        }
      }
    }, { rootMargin: '0px 0px 60px 0px' });
    document.querySelectorAll('.item').forEach(el => io.observe(el));

    /* ================= scrollspy：滚动时高亮当前分类 ================= */
    const spy = new IntersectionObserver(entries => {
      if (filterMode !== '') return;
      for (const en of entries) {
        if (en.isIntersecting) {
          const name = en.target.dataset.cat;
          catsNav.querySelectorAll('.cat-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.cat === name)
          );
        }
      }
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('.cat').forEach(sec => spy.observe(sec));

    /* ================= 回到顶部：passive + rAF 节流 ================= */
    const toTop = document.getElementById('toTop');
    toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    let ticking = false;
    window.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        toTop.classList.toggle('show', window.scrollY > 300);
        ticking = false;
      });
    }, { passive: true });
  })
  .catch(() => {
    document.getElementById('content').innerHTML =
      '<p class="loading">⚠ 未读取到 media.md，请确认它与本页面在同一目录。</p>';
  });
</script>
</body>
</html>
