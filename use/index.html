        /* --- 基础和背景设置 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #05070f;

            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

        /* --- 星空画布：固定在底层，不挡交互 --- */
        #starfield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        /* 全局文字描边阴影，保证可读性 */

        .front img, .front picture {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .back {
            background-color: #4A90E2;
            transform: rotateY(180deg);
            padding: 0;
        }

        .back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- 其他元素样式 --- */

        /* --- 导航栏样式 (防溢出) --- */

    <script>
        (function () {
            /* ============ 答案之书 ============ */
            async function fetchBookOfAnswer() {
                const answerElement = document.getElementById('answer-text');
                try {
                    const response = await fetch('https://60s.viki.moe/v2/answer');
                    if (!response.ok) throw new Error('网络响应失败');
                    const data = await response.json();
                    answerElement.textContent = `「 ${data.data.answer} 」`;
                } catch (error) {
                    console.error('获取答案之书失败:', error);
                    answerElement.textContent = '今天不宜提问';
                }
            }
            fetchBookOfAnswer();

            /* ============ 动态星空 ============ */
            const canvas = document.getElementById('starfield');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            let w = 0, h = 0, dpr = 1;
            let stars = [];
            let meteors = [];
            let lastTime = 0;
            let prevFrameT = 0;
            let meteorTimer = 0;
            let nextMeteorAt = 2500 + Math.random() * 4000;

            /* --- 预渲染光晕 sprite（避免每帧创建 gradient） --- */
            const GLOW_SIZE = 64;
            const glowCanvas = document.createElement('canvas');
            glowCanvas.width = glowCanvas.height = GLOW_SIZE;
            (function () {
                const g = glowCanvas.getContext('2d');
                const grd = g.createRadialGradient(
                    GLOW_SIZE / 2, GLOW_SIZE / 2, 0,
                    GLOW_SIZE / 2, GLOW_SIZE / 2, GLOW_SIZE / 2
                );
                grd.addColorStop(0,    'rgba(255,255,255,1)');
                grd.addColorStop(0.18, 'rgba(255,255,255,0.45)');
                grd.addColorStop(0.45, 'rgba(255,255,255,0.10)');
                grd.addColorStop(1,    'rgba(255,255,255,0)');
                g.fillStyle = grd;
                g.fillRect(0, 0, GLOW_SIZE, GLOW_SIZE);
            })();

            /* --- 星色：模拟不同色温的恒星 --- */
            const STAR_COLORS = [
                'rgba(175, 200, 255, ',  // 蓝白（O/B 型，少量）
                'rgba(215, 228, 255, ',  // 冷白（A 型）
                'rgba(245, 248, 255, ',  // 纯白（F 型，最多）
                'rgba(255, 250, 235, ',  // 暖白（G 型）
                'rgba(255, 232, 200, '   // 橙黄（K/M 型）
            ];

            function pickColor() {
                const r = Math.random();
                if (r < 0.06) return STAR_COLORS[0];
                if (r < 0.30) return STAR_COLORS[1];
                if (r < 0.70) return STAR_COLORS[2];
                if (r < 0.91) return STAR_COLORS[3];
                return STAR_COLORS[4];
            }

            /* --- 生成一颗星 --- */
            function makeStar(inGalaxy, cx, cy, ux, uy, spread) {
                let x, y;
                if (inGalaxy) {
                    // 沿银河带斜线分布，垂直方向近似高斯偏移
                    const diag = Math.sqrt(w * w + h * h) * 1.2;
                    const along = (Math.random() - 0.5) * diag;
                    const off = (Math.random() + Math.random() + Math.random() - 1.5) * spread;
                    x = cx + ux * along - uy * off;
                    y = cy + uy * along + ux * off;
                } else {
                    x = Math.random() * w;
                    y = Math.random() * h;
                }

                /*
                 * 亮度分层，模仿真实星等分布：
                 * 肉眼可见的绝大多数是暗星，亮星极少
                 */
                const roll = Math.random();
                let tier, alpha, radius;

                if (roll < 0.70) {
                    // 暗星（大多数）
                    tier = 0;
                    alpha = 0.05 + Math.random() * 0.20;
                    radius = 0.25 + Math.random() * 0.40;
                } else if (roll < 0.92) {
                    // 中等亮度
                    tier = 1;
                    alpha = 0.28 + Math.random() * 0.32;
                    radius = 0.60 + Math.random() * 0.50;
                } else if (roll < 0.985) {
                    // 亮星
                    tier = 2;
                    alpha = 0.65 + Math.random() * 0.30;
                    radius = 1.00 + Math.random() * 0.60;
                } else {
                    // 极亮星（带明显光晕）
                    tier = 3;
                    alpha = 0.88 + Math.random() * 0.12;
                    radius = 1.50 + Math.random() * 0.90;
                }

                // 银河带内整体更暗更小，呈雾状星尘感
                if (inGalaxy) {
                    alpha *= 0.60;
                    radius *= 0.78;
                }

                return {
                    x: x,
                    y: y,
                    r: radius,
                    a: alpha,
                    tier: tier,
                    color: pickColor(),
                    // 双频闪烁参数，比单一正弦更自然
                    sp1: 0.0004 + Math.random() * 0.0011,
                    sp2: 0.0017 + Math.random() * 0.0026,
                    ph1: Math.random() * Math.PI * 2,
                    ph2: Math.random() * Math.PI * 2,
                    // 闪烁幅度：亮星明显，暗星几乎不闪
                    twk: tier === 3 ? 0.55 : tier === 2 ? 0.42 : tier === 1 ? 0.26 : 0.14,
                    drift: 0.004 + Math.random() * 0.014
                };
            }

            /* --- 构建星场 --- */
            function buildStars() {
                const mobile = w < 768;
                const area = w * h;
                // 星星数量大幅提升
                const divisor = mobile ? 2600 : 1500;
                const cap = mobile ? 900 : 2000;
                const baseCount = Math.min(cap, Math.round(area / divisor));

                // 银河带：一条斜向的密集星带
                const galAngle = -Math.PI / 6.5;
                const ux = Math.cos(galAngle);
                const uy = Math.sin(galAngle);
                const gcx = w * 0.5;
                const gcy = h * 0.5;
                const gSpread = Math.min(w, h) * 0.20;

                stars = [];
                for (let i = 0; i < baseCount; i++) {
                    stars.push(makeStar(false));
                }
                const galaxyCount = Math.round(baseCount * 0.60);
                for (let i = 0; i < galaxyCount; i++) {
                    stars.push(makeStar(true, gcx, gcy, ux, uy, gSpread));
                }
            }

            /* --- 尺寸与 DPR --- */
            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = window.innerWidth;
                h = window.innerHeight;

                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                buildStars();
                render(lastTime, 1);
            }

            /* --- 流星 --- */
            function spawnMeteor() {
                const angle = Math.PI / 4 + (Math.random() - 0.5) * 0.4;
                meteors.push({
                    x: Math.random() * w * 0.8 + w * 0.1,
                    y: Math.random() * h * 0.4,
                    len: 90 + Math.random() * 130,
                    speed: 5 + Math.random() * 6,
                    angle: angle,
                    life: 1
                });
            }

            /* --- 渲染 --- */
            function render(t, dt) {
                // 重置合成模式后再清屏
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.clearRect(0, 0, w, h);

                // 星星用 lighter 叠加，发光感更真实
                ctx.globalCompositeOperation = 'lighter';

                // 第一遍：光晕（只画 tier >= 2 的亮星）
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    if (s.tier < 2) continue;

                    let alpha = s.a;
                    if (!reduceMotion) {
                        const tw = Math.sin(t * s.sp1 + s.ph1) * 0.5
                                 + Math.sin(t * s.sp2 + s.ph2) * 0.5;
                        alpha = s.a * (1 - s.twk * (0.5 + 0.5 * tw));
                    }

                    const gsize = s.r * (s.tier === 3 ? 14 : 9);
                    ctx.globalAlpha = Math.max(0, Math.min(1, alpha * 0.55));
                    ctx.drawImage(
                        glowCanvas,
                        s.x - gsize / 2, s.y - gsize / 2,
                        gsize, gsize
                    );
                }

                // 第二遍：星点本体
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];

                    let alpha = s.a;
                    if (!reduceMotion && s.tier > 0) {
                        const tw = Math.sin(t * s.sp1 + s.ph1) * 0.5
                                 + Math.sin(t * s.sp2 + s.ph2) * 0.5;
                        alpha = s.a * (1 - s.twk * (0.5 + 0.5 * tw));
                    }
                    alpha = Math.max(0, Math.min(1, alpha));
                    if (alpha < 0.02) continue;

                    ctx.globalAlpha = 1;
                    ctx.fillStyle = s.color + alpha.toFixed(3) + ')';

                    if (s.r < 0.55) {
                        // 极小星用方块，视觉无差别但更快
                        const sz = s.r * 2;
                        ctx.fillRect(s.x - s.r, s.y - s.r, sz, sz);
                    } else {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 极亮星加一个淡淡的十字星芒
                    if (s.tier === 3) {
                        const len = s.r * 6.5;
                        ctx.globalAlpha = 1;
                        ctx.strokeStyle = s.color + (alpha * 0.28).toFixed(3) + ')';
                        ctx.lineWidth = 0.7;
                        ctx.beginPath();
                        ctx.moveTo(s.x - len, s.y);
                        ctx.lineTo(s.x + len, s.y);
                        ctx.moveTo(s.x, s.y - len);
                        ctx.lineTo(s.x, s.y + len);
                        ctx.stroke();
                    }

                    // 极慢上浮
                    if (!reduceMotion) {
                        s.y -= s.drift * dt;
                        if (s.y < -3) {
                            s.y = h + 3;
                            s.x = Math.random() * w;
                        }
                    }
                }

                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';

                // 第三遍：流星
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.x += Math.cos(m.angle) * m.speed * dt;
                    m.y += Math.sin(m.angle) * m.speed * dt;
                    m.life -= 0.011 * dt;

                    if (m.life <= 0 || m.x > w + 300 || m.y > h + 300) {
                        meteors.splice(i, 1);
                        continue;
                    }

                    const tailX = m.x - Math.cos(m.angle) * m.len;
                    const tailY = m.y - Math.sin(m.angle) * m.len;
                    const lf = Math.max(m.life, 0);

                    const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
                    grad.addColorStop(0,    'rgba(255,255,255,' + lf.toFixed(3) + ')');
                    grad.addColorStop(0.35, 'rgba(200,220,255,' + (lf * 0.5).toFixed(3) + ')');
                    grad.addColorStop(1,    'rgba(255,255,255,0)');

                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(tailX, tailY);
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.8;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // 流星头部亮点
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + lf.toFixed(3) + ')';
                    ctx.fill();
                }
            }

            /* --- 主循环 --- */
            function loop(t) {
                if (!lastTime) {
                    lastTime = t;
                    prevFrameT = t;
                }
                // 帧间隔归一化到 60fps 基准，并限制最大步长
                const dt = Math.min((t - lastTime) / 16.667, 3);
                const rawDt = t - prevFrameT;
                lastTime = t;
                prevFrameT = t;

                if (!reduceMotion) {
                    meteorTimer += rawDt;
                    if (meteorTimer >= nextMeteorAt) {
                        spawnMeteor();
                        meteorTimer = 0;
                        nextMeteorAt = 3500 + Math.random() * 6500;
                    }
                }

                render(t, dt);
                requestAnimationFrame(loop);
            }

            /* --- 启动 --- */
            resize();

            if (reduceMotion) {
                // 用户系统开启「减少动态效果」：只画一帧静态星空
                render(0, 1);
            } else {
                requestAnimationFrame(loop);
            }

            // 尺寸变化（防抖）
            let resizeTimer = null;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(resize, 150);
            });
        })();
    </script>
</body>
</html>
