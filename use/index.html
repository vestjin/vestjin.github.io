<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>收藏目录</title>

<!-- ===== SVG 标签页图标（墨线书签） ===== -->
<link rel="icon" type="image/svg+xml"
  href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="%23faf8f4"/><path d="M20 12h24v40L32 42 20 52z" fill="none" stroke="%231a1a1a" stroke-width="4" stroke-linejoin="round"/><line x1="26" y1="22" x2="38" y2="22" stroke="%231a1a1a" stroke-width="3" stroke-linecap="round"/></svg>'>

<style>
  /* ===== 纸感基调 ===== */
  :root {
    --paper: #faf8f4;
    --ink: #1a1a1a;
    --ink-soft: #6b6558;
    --ink-faint: #a39c8e;
    --line: #e3ddd0;
    --line-dark: #1a1a1a;
    --panel: #fffdf8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, "Times New Roman", serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.7;
    padding: 48px 20px 80px;
    display: flex;
    justify-content: center;
  }

  .app { max-width: 860px; width: 100%; }

  /* ===== 头部 ===== */
  .header {
    border-top: 3px double var(--line-dark);
    border-bottom: 1px solid var(--line-dark);
    padding: 28px 0 20px;
    margin-bottom: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .header-left h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1.2;
  }
  .stats { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.05em; }
  .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .status-tip { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.03em; }
  .btn {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 0;
    padding: 5px 16px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: #3a3a3a; border-color: #3a3a3a; }

  /* ===== 固定右上角目录（不可拖，可折叠） ===== */
  .toc {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    width: 230px;
    background: var(--panel);
    border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(26,26,26,0.12);
  }
  .toc-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #f4efe4;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
  }
  .toc-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--ink);
    flex: 1;
  }
  .toc-count { font-size: 11px; color: var(--ink-faint); }
  .toc-toggle {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    width: 20px;
    height: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: all 0.15s;
  }
  .toc-toggle:hover { background: var(--ink); color: var(--panel); border-color: var(--ink); }

  .toc-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 12px 12px;
    max-height: 65vh;
    overflow-y: auto;
  }
  .toc.collapsed .toc-body { display: none; }
  .toc.collapsed { width: auto; }
  .toc.collapsed .toc-header { border-bottom: none; }
  .toc.collapsed .toc-count { display: none; }

  .toc-item {
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 3px 4px;
    transition: all 0.15s;
  }
  .toc-item:hover { color: var(--ink); background: #f1ece0; }
  .toc-item .num {
    font-size: 11px;
    color: var(--ink-faint);
    margin-right: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* ===== 分类 ===== */
  .category {
    padding: 34px 0 30px;
    border-bottom: 1px solid var(--line);
    scroll-margin-top: 24px;
  }
  @keyframes catFlash {
    0%   { background: transparent; }
    30%  { background: #f1ece0; }
    100% { background: transparent; }
  }
  .category.flash { animation: catFlash 1.2s ease; }

  .category-header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  .category-header .idx {
    font-size: 13px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }
  .category-header .name { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
  .category-header .count { font-size: 12px; color: var(--ink-faint); }
  .category-header .count::before { content: "· "; }

  /* ===== 网站列表 ===== */
  .sites {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 0 40px;
  }
  .site-card {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px dotted var(--line);
    text-decoration: none;
    color: var(--ink);
    font-size: 15px;
    overflow: hidden;
  }
  .site-card:hover { border-bottom-color: var(--ink); }
  .site-card .name { font-weight: 600; flex-shrink: 0; }
  .site-card .url {
    font-size: 12px;
    color: var(--ink-faint);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: ltr;
    transition: color 0.15s;
  }
  .site-card:hover .url { color: var(--ink-soft); }

  /* ===== 空状态 ===== */
  .empty-state { padding: 80px 20px; text-align: center; border-bottom: 1px solid var(--line); }
  .empty-state .icon { font-size: 40px; margin-bottom: 16px; }
  .empty-state h2 { font-size: 22px; margin-bottom: 8px; letter-spacing: 0.1em; }
  .empty-state p { color: var(--ink-soft); font-size: 15px; max-width: 420px; margin: 0 auto 24px; }
  .empty-state .hint {
    text-align: left;
    font-size: 14px;
    color: var(--ink-soft);
    max-width: 460px;
    margin: 0 auto;
    padding: 16px 20px;
    border-left: 2px solid var(--ink);
    background: #f4f0e8;
  }
  .empty-state .hint code { font-family: Georgia, serif; color: var(--ink); }

  .loading { text-align: center; padding: 80px 20px; color: var(--ink-faint); font-size: 14px; letter-spacing: 0.1em; }

  .colophon {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    padding-top: 32px;
    letter-spacing: 0.15em;
  }
  .colophon::before { content: "❦"; display: block; font-size: 16px; margin-bottom: 10px; }

  /* ===== 响应式 ===== */
  @media (max-width: 640px) {
    body { padding: 28px 16px 60px; }
    .header-left h1 { font-size: 26px; }
    .sites { grid-template-columns: 1fr; }
    .site-card { font-size: 14px; }
    .category { padding: 26px 0 22px; }
    .category-header .name { font-size: 18px; }
    .toc { top: 10px; right: 10px; width: 190px; }
  }

  /* ===== 打印友好 ===== */
  @media print {
    body { background: #fff; padding: 0; }
    .toc, .header-right { display: none; }
    .category { break-inside: avoid; }
  }

  ::selection { background: #e8e0cf; }
</style>
</head>
<body>
<div class="app">

  <!-- 头部 -->
  <header class="header">
    <div class="header-left">
      <h1>收藏目录</h1>
      <span class="stats" id="stats">—</span>
    </div>
    <div class="header-right">
      <span class="status-tip" id="statusTip">bookmarks.txt</span>
      <button class="btn btn-primary" id="reloadBtn">重新加载</button>
    </div>
  </header>

  <!-- 内容 -->
  <main id="content"></main>

  <footer class="colophon">MCMXCVIII · PERSONAL INDEX</footer>

</div>

<!-- 固定右上角目录（不可拖，可折叠） -->
<nav class="toc" id="toc" style="display:none;">
  <div class="toc-header" id="tocHeader">
    <span class="toc-title">目 录</span>
    <span class="toc-count" id="tocCount">0</span>
    <button class="toc-toggle" id="tocToggle" type="button">−</button>
  </div>
  <div class="toc-body" id="tocBody"></div>
</nav>

<script>
(function() {
  'use strict';

  const TXT_FILE = 'bookmarks.txt';
  const POLL_INTERVAL = 60000;
  const KEY_COLLAPSED = 'nav-toc-collapsed';
  const MOBILE_BREAKPOINT = 640;

  const contentEl = document.getElementById('content');
  const statsEl = document.getElementById('stats');
  const statusTip = document.getElementById('statusTip');
  const reloadBtn = document.getElementById('reloadBtn');
  const tocEl = document.getElementById('toc');
  const tocHeader = document.getElementById('tocHeader');
  const tocBody = document.getElementById('tocBody');
  const tocCount = document.getElementById('tocCount');
  const tocToggle = document.getElementById('tocToggle');

  let lastContent = null;

  /* ================= 解析 ================= */
  function parseTxt(text) {
    const lines = text.split(/\r?\n/);
    const categories = [];
    let currentCategory = null;
    for (let raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith('##')) {
        const name = line.replace(/^##\s*/, '').trim();
        if (name) {
          currentCategory = { name, sites: [] };
          categories.push(currentCategory);
        }
        continue;
      }
      if (line.includes('-')) {
        const idx = line.indexOf('-');
        const siteName = line.slice(0, idx).trim();
        let siteUrl = line.slice(idx + 1).trim();
        if (siteUrl && !/^https?:\/\//i.test(siteUrl)) siteUrl = 'https://' + siteUrl;
        if (siteName && siteUrl) {
          if (!currentCategory) {
            currentCategory = { name: '未分类', sites: [] };
            categories.push(currentCategory);
          }
          currentCategory.sites.push({ name: siteName, url: siteUrl });
        }
      }
    }
    return categories;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ================= 折叠 ================= */
  function setCollapsed(collapsed, save) {
    tocEl.classList.toggle('collapsed', collapsed);
    tocToggle.textContent = collapsed ? '+' : '−';
    tocToggle.title = collapsed ? '展开目录' : '折叠目录';
    if (save !== false) {
      try { localStorage.setItem(KEY_COLLAPSED, collapsed ? '1' : '0'); } catch (e) {}
    }
  }

  /* ================= 渲染目录 ================= */
  function renderToc(items) {
    if (!items || items.length === 0) {
      tocEl.style.display = 'none';
      tocBody.innerHTML = '';
      return;
    }
    tocEl.style.display = '';
    tocCount.textContent = items.length + ' 类';
    tocBody.innerHTML = items.map(it =>
      `<a class="toc-item" href="#${it.id}" data-target="${it.id}">
         <span class="num">${it.idx}</span>${escapeHtml(it.name)}
       </a>`
    ).join('');
  }

  /* ================= 渲染主体 ================= */
  function render(categories) {
    const valid = (categories || []).filter(cat => cat.sites && cat.sites.length > 0);

    if (valid.length === 0) {
      contentEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">✕</div>
          <h2>暂无收录</h2>
          <p>请确保 bookmarks.txt 与本页面位于同一目录，且包含有效的分类与网址。</p>
          <div class="hint">
            文件格式：<br />
            <code>## 分类名称</code><br />
            <code>网站名-https://example.com</code>
          </div>
        </div>`;
      statsEl.textContent = '共 0 条';
      renderToc([]);
      return;
    }

    let totalSites = 0;
    let html = '';
    const tocItems = [];

    valid.forEach((cat, i) => {
      const idx = String(i + 1).padStart(2, '0');
      const catId = 'cat-' + i;
      totalSites += cat.sites.length;
      tocItems.push({ id: catId, idx, name: cat.name, count: cat.sites.length });

      html += `<section class="category" id="${catId}">`;
      html += `<div class="category-header">
                 <span class="idx">${idx}</span>
                 <span class="name">${escapeHtml(cat.name)}</span>
                 <span class="count">${cat.sites.length} 则</span>
               </div>`;
      html += `<div class="sites">`;
      for (const site of cat.sites) {
        const displayUrl = site.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        html += `<a class="site-card" href="${site.url}" target="_blank" rel="noopener noreferrer"
                    title="${escapeHtml(site.name + ' · ' + site.url)}">
                   <span class="name">${escapeHtml(site.name)}</span>
                   <span class="url">${escapeHtml(displayUrl)}</span>
                 </a>`;
      }
      html += `</div></section>`;
    });

    contentEl.innerHTML = html;
    statsEl.textContent = `共 ${totalSites} 则 · ${valid.length} 类`;
    renderToc(tocItems);
  }

  /* ================= 加载 ================= */
  function loadFromText(text) {
    const categories = parseTxt(text);
    if (categories.length === 0) {
      render([]);
      statusTip.textContent = `⚠ 格式无效 (${new Date().toLocaleTimeString()})`;
      return false;
    }
    render(categories);
    statusTip.textContent = `✓ 已更新 (${new Date().toLocaleTimeString()})`;
    return true;
  }

  function fetchAndLoad(showLoading = true) {
    if (showLoading) {
      contentEl.innerHTML = `<div class="loading">正在加载 …</div>`;
      tocEl.style.display = 'none';
    }
    fetch(TXT_FILE, { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => {
        if (lastContent !== null && text === lastContent) {
          statusTip.textContent = `— 无变化 (${new Date().toLocaleTimeString()})`;
          if (showLoading) render(parseTxt(text));
          return;
        }
        lastContent = text;
        loadFromText(text);
      })
      .catch(() => {
        contentEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">✕</div>
            <h2>加载失败</h2>
            <p>未能读取 bookmarks.txt，请检查文件是否与本页面在同一目录。</p>
          </div>`;
        renderToc([]);
        statusTip.textContent = `✕ 加载失败 (${new Date().toLocaleTimeString()})`;
      });
  }

  /* ================= 初始化 ================= */
  function init() {
    // 折叠状态：手机端默认折叠，桌面端记忆上次状态
    let collapsed;
    const isMobile = window.matchMedia('(max-width: ' + MOBILE_BREAKPOINT + 'px)').matches;
    if (isMobile) {
      collapsed = true;
    } else {
      try { collapsed = localStorage.getItem(KEY_COLLAPSED) === '1'; } catch (e) { collapsed = false; }
    }
    setCollapsed(collapsed, false);

    // 点标题栏任意处切换折叠（按钮自身也会冒泡到这里，无需单独监听）
    tocHeader.addEventListener('click', () => {
      setCollapsed(!tocEl.classList.contains('collapsed'));
    });

    // 点击目录项平滑滚动 + 高亮
    tocBody.addEventListener('click', (e) => {
      const item = e.target.closest('.toc-item');
      if (!item) return;
      e.preventDefault();
      const target = document.getElementById(item.dataset.target);
      if (!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      target.classList.remove('flash');
      void target.offsetWidth;
      target.classList.add('flash');
      setTimeout(() => target.classList.remove('flash'), 1300);
    });

    reloadBtn.addEventListener('click', () => fetchAndLoad(true));
    fetchAndLoad(true);
    setInterval(() => fetchAndLoad(false), POLL_INTERVAL);
  }

  init();
})();
</script>
</body>
</html>
